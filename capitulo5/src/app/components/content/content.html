<div class="container py-5">
  <div class="card shadow mx-auto" style="max-width: 400px;">
    <div class="card-body text-center p-4">

      <h1 class="display-1 fw-bold mb-4">{{number()}}</h1>

      <div class="d-flex justify-content-center gap-3 mb-4">
        <button class="btn btn-outline-danger" (click)="decremento()">decremento</button>
        <button class="btn btn-outline-success" (click)="incremento()">incremento</button>
      </div>

      <div class="d-flex gap-2">
        <input type="number" class="form-control" placeholder="valor" #reinicio [value]="dataInput()" (input)="dataInput.set(reinicio.value)">
        <button class="btn btn-primary" (click)="reiniciar()">reiniciar</button>
      </div>

    </div>
  </div>
</div>
