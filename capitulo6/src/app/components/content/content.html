<div class="container mt-3">
  <h1 class="display-3 text-center mb-4">Productos Disponibles</h1>
  <div class="row g-4">
    @for (tmp of products(); track $index) {
      <div class="col-12 col-sm-6 col-lg-4">
        <app-productcard
         [product]="tmp"
         (deleteProduct)="deleteProductC($event)"
        >

        </app-productcard>
      </div>
    }
  </div>
</div>
