<div class="card shadow border-1" style="max-width: 300px;">
  <div class="card-body">
    <h5 class="card-title fw-bold mb-3">{{pet().name}}</h5>

    <p class="card-text text-muted mb-3">
      <strong>Edad: </strong> {{pet().age}}
    </p>
    <span class="badge text-bg-primary mb-3">
      {{pet().specie}}
    </span>
     <br>
    <button class="btn btn-danger" (click)="emitNamePet()">eliminar</button>
  </div>

</div>
