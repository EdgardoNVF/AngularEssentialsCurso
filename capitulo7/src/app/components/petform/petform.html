<div class="card shadow border-0">
  <div class="card-header">
      <h2 class="h5 mb-0">Registro de Mascota</h2>
  </div>

  <div class="card-body">
      <div class="mb-3">
           <label class="form-label" for="name">Nombre</label>
           <input class="form-control" type="text" id="name" [(ngModel)]="pet().name">
      </div>

      <div class="mb-3">
          <label class="form-label" for="age">Edad</label>
          <input class="form-control" type="number" id="age" [(ngModel)]="pet().age">
      </div>

      <div class="mb-3">
          <label class="form-label" for="specie">Especie</label>
          <select
          id="specie"
          class="form-select"
          [(ngModel)]="pet().specie"
          >

            @for (option of options; track option) {
               <option [value]="option">{{option}}</option>
            }

          </select>
      </div>

      <div class="mb-3">
           <button class="btn btn-primary w-100"
           (click)="emitPet()">Registrar</button>
      </div>
  </div>

  @if(error()){
    <div class="card-footer">
      <p style="color: red;">{{mensaje()}}</p>
    </div>
  }

</div>
